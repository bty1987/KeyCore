; KeyCore · ESP32-S3-WROOM-1-N4R8 (4MB Flash + 8MB Octal PSRAM)
; 烧录: pio run -t upload -e bringup && pio run -t monitor -e bringup
; USB-C 即芯片内置 USB-Serial-JTAG, 无需外部串口; 进不了下载模式时按住 BOOT(SW1) 再插 USB
; 默认 env = bringup (收板自检); P0 单键验证固件保留在 env p0-single-key

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; N4R8: 4MB QIO Flash + 8MB OPI PSRAM —— memory_type 必须是 qio_opi, 否则 PSRAM 认不到
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
monitor_filters = time

[env:bringup]
src_filter = -<*> +<main.cpp>

[env:p0-single-key]
src_filter = -<*> +<p0_single_key.cpp>
