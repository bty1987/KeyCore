<div id="hud">v5.3 · 67 键 · 块17.05/缝2.0 · 全竖立双磁±7.025·极面缝3.0 · F11 全屏 · R 转180° · 敲键盘预览</div>
<script>
const PXW=1920, PXH=1080;
let rot = localStorage.getItem('rot180')==='1';
function fit(){
  const s=Math.min(innerWidth/PXW, innerHeight/PXH);
  document.getElementById('stage').style.transform=`scale(${s}) rotate(${rot?180:0}deg)`;
}
addEventListener('resize',fit); fit();
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){
  rot=!rot; localStorage.setItem('rot180', rot?'1':'0'); fit();}});
// 标签三级字号：单字母 big / 符号 sym / 词组 word
document.querySelectorAll('.lbl').forEach(el=>{
  const t=el.textContent.trim();
  el.classList.add(/^[A-Z]$/.test(t)?'t-big':(t.length===1||'⌫⇧=−[]\/,.'.includes(t))?'t-sym':'t-word');
});
// 动效区大时钟
function tick(){const n=new Date(),p=x=>String(x).padStart(2,'0');
  document.getElementById('clk-t').textContent=p(n.getHours())+':'+p(n.getMinutes());
  document.getElementById('clk-d').textContent=['周日','周一','周二','周三','周四','周五','周六'][n.getDay()]+' · '+(n.getMonth()+1)+'月'+n.getDate()+'日';}
tick(); setInterval(tick,1000);
const byKey={}; document.querySelectorAll('.key').forEach(el=>byKey[el.dataset.k.toUpperCase()]=el);
const nameMap={' ':'Space','CONTROL':'LCtrl','META':'LGui','ALT':'LAlt','ALTGRAPH':'RAlt','SHIFT':'LShift',
 'CAPSLOCK':'CapsLock','ENTER':'Enter','BACKSPACE':'Backspace','TAB':'Tab','ESCAPE':'Esc','MENU':'Menu'};
addEventListener('keydown',e=>{const n=(nameMap[e.key.toUpperCase()]||e.key.toUpperCase());
  const el=byKey[n]; if(el)el.classList.add('on');});
addEventListener('keyup',e=>{const n=(nameMap[e.key.toUpperCase()]||e.key.toUpperCase());
  const el=byKey[n]; if(el)el.classList.remove('on');});
function wsLink(url){const ws=new WebSocket(url);ws.onmessage=e=>{
  const [cmd,k]=e.data.split(':');const el=byKey[k.toUpperCase()];
  if(el)el.classList.toggle('on',cmd==='on');};return ws;}
</script></body></html>
