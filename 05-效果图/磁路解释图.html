<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<title>磁路三视图 v5.4 · 全竖立同向侧磁（2026-10-02）</title>
<style>
  html,body{margin:0;background:#05070d;color:#cfe0ff;font-family:system-ui,sans-serif}
  .wrap{padding:24px 28px}
  h1{font-size:22px;font-weight:700;margin:0 0 4px}
  .sub{color:#5f7ba8;font-size:13px;margin-bottom:18px;max-width:1100px}
  .panel{display:inline-block;vertical-align:top;background:#0a0f1a;border:1px solid #223048;border-radius:10px;margin:0 14px 16px 0;padding:14px 16px}
  .panel h2{font-size:15px;color:#8fb8ff;margin:0 0 10px;font-weight:600}
  svg{display:block}
  text{font-family:system-ui}
  .tag{fill:#8fb8ff;font-size:12px}
  .dim{fill:#5f7ba8;font-size:11px}
  .nlabel{fill:#ff9d6b;font-size:13px;font-weight:700}
  .note{fill:#7d92bd;font-size:11px}
  .warn{fill:#ffd27d;font-size:11px}
</style></head><body><div class="wrap">
<h1>KeyCore 磁路三视图 · v5.4 全竖立 · 同排同向</h1>
<div class="sub">2026-10-02 修正：同排所有磁铁全部同一个方向（帽间<b>没有互斥</b>）· 磁铁完全嵌入键帽内部 · 托浮/回弹 = 键帽磁铁 与 板上竖立磁铁 的竖直同向对斥 · 单帽试产先行，双磁不行升三磁兜底</div>

<!-- ① 俯视：同排同向 -->
<div class="panel"><h2>① 俯视 · 同排磁铁全部同向（1u，两键示例）</h2>
<svg width="520" height="330" viewBox="0 0 520 330">
  <!-- 左帽（键心 x=150），右帽（键心 x=355.5），块 17.05，缝 2.05；1mm=10px -->
  <rect x="65" y="60" width="170.5" height="170.5" rx="8" fill="rgba(90,140,255,.08)" stroke="#3a4d75" stroke-width="1.5"/>
  <rect x="270.5" y="60" width="170.5" height="170.5" rx="8" fill="rgba(90,140,255,.08)" stroke="#3a4d75" stroke-width="1.5"/>
  <!-- 四颗磁铁：全部同向（N 朝 +x），完全嵌入帽内部（虚线=嵌在帽体里） -->
  <!-- 左帽：磁心 ±7.025 → x=150-70.25-10=69.75 与 150+70.25-10=210.25（磁铁宽2mm=20px） -->
  <rect x="69.8" y="140" width="20" height="40" rx="2" fill="#2b3b5e" stroke="#ff9d6b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="74" y1="160" x2="84" y2="160" stroke="#ff9d6b" stroke-width="2"/>
  <path d="M84 160 l-6 -3.5 v7 z" fill="#ff9d6b"/>
  <text x="60" y="165" class="nlabel" text-anchor="end">N</text>
  <rect x="210.3" y="140" width="20" height="40" rx="2" fill="#2b3b5e" stroke="#ff9d6b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="214" y1="160" x2="224" y2="160" stroke="#ff9d6b" stroke-width="2"/>
  <path d="M224 160 l-6 -3.5 v7 z" fill="#ff9d6b"/>
  <!-- 右帽两颗：同向 -->
  <rect x="275.3" y="140" width="20" height="40" rx="2" fill="#2b3b5e" stroke="#ff9d6b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="279" y1="160" x2="289" y2="160" stroke="#ff9d6b" stroke-width="2"/>
  <path d="M289 160 l-6 -3.5 v7 z" fill="#ff9d6b"/>
  <text x="266" y="165" class="nlabel" text-anchor="end">N</text>
  <rect x="415.8" y="140" width="20" height="40" rx="2" fill="#2b3b5e" stroke="#ff9d6b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="419" y1="160" x2="429" y2="160" stroke="#ff9d6b" stroke-width="2"/>
  <path d="M429 160 l-6 -3.5 v7 z" fill="#ff9d6b"/>
  <!-- 缝标注（标准缝，无特殊作用） -->
  <line x1="235.5" y1="127" x2="270.5" y2="127" stroke="#5f7ba8" stroke-width="1"/>
  <text x="253" y="120" class="dim" text-anchor="middle">帽缝 2.05（标准）</text>
  <!-- 尺寸 -->
  <text x="150" y="250" class="dim" text-anchor="middle">块 17.05</text>
  <text x="355.5" y="250" class="dim" text-anchor="middle">块 17.05</text>
  <text x="150" y="268" class="dim" text-anchor="middle">磁心 ±7.025（外壁 0.5）</text>
  <text x="355.5" y="268" class="dim" text-anchor="middle">磁心 ±7.025</text>
  <text x="260" y="300" class="note" text-anchor="middle">同排全部同向（示例 N 朝 +x）· 帽间无互斥 · 磁铁完全嵌入帽体内部</text>
  <text x="260" y="318" class="warn" text-anchor="middle">宽键磁心 = wu×9.525−2.0−wall_t · 方向装配时逐排校一次即可</text>
</svg></div>

<!-- ② 侧剖：竖直同向对斥 -->
<div class="panel"><h2>② 侧剖 · 磁铁嵌帽内 + 板上竖立磁铁（竖直对斥=托浮/回弹）</h2>
<svg width="640" height="330" viewBox="0 0 640 330">
  <!-- z 基准：屏顶=0 → y=250，1mm=10px 向上递减 -->
  <!-- 键帽块：块底 z=5(y=200)，块顶 z=12.5(y=125) -->
  <rect x="180" y="125" width="170.5" height="75" rx="4" fill="rgba(120,180,255,.14)" stroke="#6f9fd8" stroke-width="1.5"/>
  <!-- 帽内磁铁（完全嵌入）：z 块底+0~4.1 → y=160..200，宽 2mm -->
  <rect x="230" y="160" width="20" height="40" rx="1" fill="#2b3b5e" stroke="#ff9d6b" stroke-width="1.5"/>
  <rect x="280" y="160" width="20" height="40" rx="1" fill="#2b3b5e" stroke="#ff9d6b" stroke-width="1.5"/>
  <line x1="234" y1="180" x2="244" y2="180" stroke="#ff9d6b" stroke-width="2"/>
  <path d="M244 180 l-6 -3.5 v7 z" fill="#ff9d6b"/>
  <line x1="284" y1="180" x2="294" y2="180" stroke="#ff9d6b" stroke-width="2"/>
  <path d="M294 180 l-6 -3.5 v7 z" fill="#ff9d6b"/>
  <!-- 厚板：板顶 z=11.5(y=135)，盲孔深 6.5 → 孔底 z=5(y=200)，板底 z=2.5(y=225) -->
  <!-- 板体（挖去盲孔段 y=135..200 之间的孔口） -->
  <path d="M60 135 h90 v65 h240 v-65 h90 v90 H60 z" fill="rgba(140,170,220,.10)" stroke="#3a4d75" stroke-width="1.5"/>
  <!-- 孔底竖立磁铁（板上，同向）：立于孔底 z=5 → y=200..160？磁铁高 4 → y=160..200 与帽磁铁对置 -->
  <rect x="232" y="160" width="16" height="40" fill="none" stroke="#ffd27d" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="278" y="160" width="16" height="40" fill="none" stroke="#ffd27d" stroke-width="1.2" stroke-dasharray="3 2"/>
  <!-- 竖直对斥箭头（帽磁铁 ↓ 与板磁铁 ↑ 对斥） -->
  <line x1="240" y1="150" x2="240" y2="130" stroke="#ffd27d" stroke-width="2"/>
  <path d="M240 130 l-4 8 h8 z" fill="#ffd27d"/>
  <line x1="290" y1="150" x2="290" y2="130" stroke="#ffd27d" stroke-width="2"/>
  <path d="M290 130 l-4 8 h8 z" fill="#ffd27d"/>
  <text x="330" y="145" class="warn">竖直同向对斥 = 托浮 + 回弹（数量/层高 P0′ 定）</text>
  <!-- 悬浮/行程 -->
  <line x1="150" y1="200" x2="150" y2="160" stroke="#5f7ba8" stroke-width="1"/>
  <text x="142" y="184" class="dim" text-anchor="end">悬浮</text>
  <line x1="150" y1="200" x2="150" y2="230" stroke="#5f7ba8" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="142" y="220" class="dim" text-anchor="end">行程 3</text>
  <!-- 屏 -->
  <rect x="60" y="250" width="430" height="25" fill="rgba(90,220,180,.10)" stroke="#3a6a5a" stroke-width="1.5"/>
  <text x="497" y="268" class="tag">IPS 屏 2.5</text>
  <!-- PCB -->
  <rect x="60" y="295" width="430" height="16" fill="rgba(255,157,107,.12)" stroke="#8a5a3a" stroke-width="1.5"/>
  <text x="497" y="308" class="tag">霍尔 PCB</text>
  <rect x="230" y="288" width="16" height="7" fill="#ffd27d" rx="1"/>
  <text x="252" y="285" class="warn">霍尔点位 P0′ 扫定（竖立磁铁正下方 B_z≈0）</text>
  <!-- 气隙标注 -->
  <text x="497" y="230" class="note">气隙 2（温漂防线）</text>
  <text x="320" y="326" class="note">同排同向 · 帽磁铁完全嵌入 · 板上竖立磁铁与帽内磁铁逐对竖直对置 · 兜底=+底心第 3 颗（霍尔正对）</text>
</svg></div>

</div></body></html>
