<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<title>键帽块 v5 · 全竖立侧磁（2026-10-02）</title>
<style>
  html,body{margin:0;background:#05070d;color:#cfe0ff;font-family:system-ui,sans-serif}
  .wrap{padding:24px 28px}
  h1{font-size:22px;font-weight:700;margin:0 0 4px}
  .sub{color:#5f7ba8;font-size:13px;margin-bottom:18px}
  .panel{display:inline-block;vertical-align:top;background:#0a0f1a;border:1px solid #223048;border-radius:10px;margin:0 14px 16px 0;padding:14px 16px}
  .panel h2{font-size:15px;color:#8fb8ff;margin:0 0 10px;font-weight:600}
  svg{display:block}
  text{font-family:system-ui}
  .tag{fill:#8fb8ff;font-size:12px}
  .dim{fill:#5f7ba8;font-size:11px}
  .nlabel{fill:#ff9d6b;font-size:14px;font-weight:700}
  .note{fill:#7d92bd;font-size:11px}
  .warn{fill:#ffd27d;font-size:11px}
</style></head><body><div class="wrap">
<h1>KeyCore 键帽块 · v5 全竖立侧磁（树脂透明帽，示意不透光）</h1>
<div class="sub">块 17.05×17.0×7.5 · 竖立腔 Ø4.1 横插（轴心高 2.05）· 磁铁 N52 4×2 · 外壁 0.5 · 极面间隙 3.0 · 相邻帽 N-N 对斥</div>

<!-- A · 正视（从邻键方向看右侧壁）：极面 confrontation -->
<div class="panel"><h2>① 正视 · 极面朝缝隙（沿键排方向）</h2>
<svg width="560" height="330" viewBox="0 0 560 330">
  <!-- 1mm=10px；本键块右侧面 x=200..370.5（17.05），底 y=250，高 75 -->
  <rect x="200" y="175" width="170.5" height="75" rx="6" fill="rgba(120,180,255,.10)" stroke="#6f9fd8" stroke-width="1.5"/>
  <!-- 竖立磁铁极面（藏在 0.5 壁后，透视图示）：Ø4 → 40px 高，中心 y=250-20.5=229.5 -->
  <circle cx="272.5" cy="229.5" r="20" fill="rgba(255,157,107,.25)" stroke="#ff9d6b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="272.5" y="235" class="nlabel" text-anchor="middle">N</text>
  <text x="272.5" y="268" class="dim" text-anchor="middle">外壁 0.5（极面在其后）</text>
  <!-- 邻帽（ghost，键距 190.5px） -->
  <rect x="390.5" y="175" width="170.5" height="75" rx="6" fill="rgba(120,180,255,.04)" stroke="#3a4d75" stroke-width="1" stroke-dasharray="5 4"/>
  <circle cx="463" cy="229.5" r="20" fill="rgba(255,157,107,.12)" stroke="#ff9d6b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="463" y="235" class="nlabel" text-anchor="middle">N</text>
  <!-- 极面间隙 3.0 -->
  <line x1="285" y1="195" x2="410.5" y2="195" stroke="#5f7ba8" stroke-width="1"/>
  <text x="347.7" y="188" class="dim" text-anchor="middle">极面间隙 3.0</text>
  <!-- 对斥箭头 -->
  <line x1="295" y1="229.5" x2="330" y2="229.5" stroke="#ff9d6b" stroke-width="2"/>
  <path d="M330 229.5 l-8 -4 v8 z" fill="#ff9d6b"/>
  <line x1="440" y1="229.5" x2="405" y2="229.5" stroke="#ff9d6b" stroke-width="2"/>
  <path d="M405 229.5 l8 -4 v8 z" fill="#ff9d6b"/>
  <text x="367" y="215" class="tag" text-anchor="middle">N-N 对斥</text>
  <!-- 尺寸 -->
  <text x="285" y="168" class="dim" text-anchor="middle">块 17.05（y 向 17.0）</text>
  <text x="285" y="290" class="note" text-anchor="middle">腔轴心高 2.05 · Ø4.1 · 从外侧壁水平钻入</text>
  <text x="285" y="308" class="note" text-anchor="middle">磁铁 4×2 圆盘竖立 · 横插 401 胶 · 同侧批量同向</text>
</svg></div>

<!-- B · 侧剖（沿键排切开）：腔体与参数 -->
<div class="panel"><h2>② 侧剖 · 块内腔体（切过键中心）</h2>
<svg width="560" height="330" viewBox="0 0 560 330">
  <!-- 1mm=10px；块 17.05×7.5：x=180..350.5，底 y=250，顶 y=175 -->
  <rect x="180" y="175" width="170.5" height="75" rx="4" fill="rgba(120,180,255,.10)" stroke="#6f9fd8" stroke-width="1.5"/>
  <!-- 左腔：从左侧面(180)向内到 x=180+25.0=205（深2.5）；磁铁 6.5..26.5?? 按 v5.3：磁心±7.025 → 左磁铁 6.025..8.025mm → x=180+(8.525-8.025)*10=185 .. 180+(8.525-6.025)*10=205 -->
  <rect x="181" y="209" width="25" height="41" fill="none" stroke="#5f7ba8" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="185" y="210" width="20" height="40" rx="1" fill="#2b3b5e" stroke="#ff9d6b" stroke-width="1.5"/>
  <text x="178" y="234" class="nlabel" text-anchor="end">N←</text>
  <!-- 右腔：镜像 -->
  <rect x="324.5" y="209" width="25" height="41" fill="none" stroke="#5f7ba8" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="325.5" y="210" width="20" height="40" rx="1" fill="#2b3b5e" stroke="#ff9d6b" stroke-width="1.5"/>
  <text x="352" y="234" class="nlabel">→N</text>
  <!-- 尺寸：总宽 -->
  <line x1="180" y1="262" x2="350.5" y2="262" stroke="#5f7ba8" stroke-width="1"/>
  <text x="265" y="276" class="dim" text-anchor="middle">17.05</text>
  <!-- 高 -->
  <line x1="166" y1="175" x2="166" y2="250" stroke="#5f7ba8" stroke-width="1"/>
  <text x="158" y="216" class="dim" text-anchor="end">7.5</text>
  <!-- 磁心偏移 -->
  <line x1="265" y1="165" x2="195" y2="165" stroke="#5f7ba8" stroke-width="1"/>
  <text x="195" y="158" class="dim" text-anchor="middle">−7.025</text>
  <line x1="265" y1="165" x2="335" y2="165" stroke="#5f7ba8" stroke-width="1"/>
  <text x="335" y="158" class="dim" text-anchor="middle">+7.025</text>
  <!-- 腔标注 -->
  <text x="360" y="200" class="note">腔深 2.5（Ø4.1）</text>
  <text x="360" y="216" class="note">磁铁 2×4（4×2 盘竖立）</text>
  <text x="360" y="232" class="note">外壁 0.5</text>
  <text x="360" y="248" class="note">轴心高 2.05</text>
  <text x="265" y="300" class="note" text-anchor="middle">邻帽同构 → 左右磁铁分别与两邻 confront，侧向居中 + 行程内助推抵消</text>
  <text x="265" y="318" class="warn" text-anchor="middle">垂直托浮/回弹由孔底/PCB 平贴对斥承担（P0′ 定数量）；不足则升三磁兜底</text>
</svg></div>

</div></body></html>
